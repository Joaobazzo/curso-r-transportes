# English version of the course. It is a separate Quarto project that is
# published inside the Portuguese site, at <site>/en/. Each page here has the
# same file name as its Portuguese counterpart in the folder above.
#
# Render the Portuguese site FIRST (it cleans _site/), then this one:
#   quarto render            # Portuguese -> _site/
#   quarto render en         # English    -> _site/en/
#
# The R code runs from the course root (knitr root.dir below), so the
# paths dados/..., R/... are the same as in the Portuguese pages. Images,
# slides and downloads are not copied: links point to ../img, ../slides, etc.

project:
  type: book
  output-dir: ../_site/en

book:
  title: "Data Analysis with R for Transport Planning"
  subtitle: "Ministry of Transport, Brazil — Undersecretariat for Development and Planning"
  author: "João Pedro Bazzo Vieira"
  date: today
  date-format: "YYYY-MM-DD"
  search: true
  repo-url: https://github.com/Joaobazzo/curso-r-transportes
  repo-subdir: en
  repo-actions: [issue, source]
  repo-branch: main
  sidebar:
    style: docked
    collapse-level: 1
  page-footer:
    left: "R course for transport planning · Text [CC BY-SA 4.0](https://github.com/Joaobazzo/curso-r-transportes/blob/main/LICENSE.md), code MIT"
    right: "Made with [Quarto](https://quarto.org)"
  chapters:
    - index.qmd
    - anedota.qmd
    - part: "Getting ready"
      chapters:
        - m0-00-preparacao.qmd
    - part: "Module 1 — R fundamentals and data wrangling"
      chapters:
        - m1-00-visao-geral.qmd
        - m1-01-ambiente.qmd
        - m1-02-linguagem.qmd
        - m1-03-datas-strings.qmd
        - m1-04-manipulacao.qmd
        - m1-05-limpeza.qmd
        - m1-06-joins.qmd
        - m1-07-ggplot2.qmd
        - m1-08-estudo-de-caso.qmd
        - m1-08b-modelo4etapas.qmd
        - m1-09-exercicios.qmd
    - part: "Module 2 — Spatial objects: vectors and rasters"
      chapters:
        - m2-00-visao-geral.qmd
        - m2-06-bases.qmd
        - m2-01-sf.qmd
        - m2-02-crs.qmd
        - m2-03-geometrias.qmd
        - m2-04-raster.qmd
        - m2-05-mapas.qmd
        - m2-07-estudo-de-caso.qmd
        - m2-08-exercicios.qmd
    - part: "Module 3 — Advanced geospatial data: DuckDB, geocoding and routing"
      chapters:
        - m3-00-visao-geral.qmd
        - m3-02c-funcoes.qmd
        - m3-02d-declividade.qmd
        - m3-03-geocodificacao.qmd
        - m3-02-duckdb.qmd
        - m3-02b-comexstat.qmd
        - m3-05-matrizes.qmd
        - m3-06-estudo-de-caso.qmd
        - m3-07-exercicios.qmd
    - part: "Module 4 — Remote sensing and accessibility"
      chapters:
        - m4-00-visao-geral.qmd
        - m4-00b-osm.qmd
        - m4-00c-roteamento.qmd
        - m4-04-acessibilidade.qmd
        - m5-02b-git.qmd
        - m5-03a-relatorio-municipal.qmd
        - m5-03-parametrizados.qmd
        - m4-06-exercicios.qmd
    - part: "Module 5 — Thematic maps, reproducible reports and final project"
      chapters:
        - m5-00-visao-geral.qmd
        - m4-01-r5r-gtfs.qmd
        - m4-05-r5r.qmd
        - m5-02-quarto.qmd
        - m5-04-projeto.qmd
        - m5-04b-projeto-sp.qmd
        - m5-05-proximos-passos.qmd
    - a-dados.qmd
    - a-diagnostico-rede.qmd
    - a-recursos.qmd

format:
  html:
    theme:
      light: [cosmo, ../styles.scss]
      dark: [darkly, ../styles-dark.scss]
    css: ../styles.css
    # language button (Portuguese / English), shared with the Portuguese site
    include-after-body: ../idioma.html
    toc: true
    toc-title: "On this page"
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
    code-link: true
    fig-align: center
    fig-width: 8
    fig-height: 5
    fig-dpi: 150
    df-print: paged
    link-external-newwindow: true
    lang: en

execute:
  freeze: auto
  warning: false
  message: false

knitr:
  opts_knit:
    # run the code from the course root, like the Portuguese pages
    root.dir: ".."
  opts_chunk:
    comment: "#>"
    collapse: true
    dev: "png"
